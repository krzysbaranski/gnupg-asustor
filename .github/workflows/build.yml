name: Build ASUSTOR APK Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            wget \
            bzip2 \
            make \
            gettext \
            texinfo \
            libgnutls28-dev \
            libbz2-dev \
            zlib1g-dev \
            libncurses5-dev \
            libsqlite3-dev \
            libldap2-dev \
            libreadline-dev \
            libusb-1.0-0-dev
      
      - name: Build GnuPG and dependencies
        run: |
          chmod +x ./build.sh
          ./build.sh
      
      - name: Verify build output
        run: |
          echo "Checking package structure..."
          find apkg -type f | head -20
          echo ""
          echo "Checking binaries..."
          ls -lh apkg/usr/local/gnupg/bin/ || echo "No binaries found"
      
      - name: Package ASUSTOR App
        uses: asustor-contrib/ga-package-asustor-app@v2
        with:
          apkg-dir: 'apkg'
          out-dir: 'dist'
      
      - name: List package files
        run: |
          echo "Built packages:"
          ls -lh dist/
      
      - name: Upload APK package
        uses: actions/upload-artifact@v4
        with:
          name: gnupg-asustor-apk
          path: dist/*.apk
          if-no-files-found: error
      
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
